<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2.5D Mobile Roguelike Dungeon Crawler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: #0a0a0c; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* HUD Overlay */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px; pointer-events: none;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 15, 20, 0.8); padding: 12px 16px;
            border: 1px solid #333; border-radius: 10px; backdrop-filter: blur(4px);
        }
        .hud-group { display: flex; flex-direction: column; gap: 4px; }
        .stat-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; }
        .bar-container { width: 120px; height: 12px; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
        #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444); transition: width 0.15s; }
        .floor-badge { color: #fbbf24; font-size: 16px; letter-spacing: 1px; font-weight: bold; }

        /* Floating Log */
        #log {
            position: absolute; top: 80px; right: 15px; width: 220px; pointer-events: none;
            display: flex; flex-direction: column; gap: 4px; text-align: right; font-size: 12px;
        }
        .log-msg { background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }

        /* Mobile Touch Controls */
        #virtual-joystick {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; pointer-events: auto; display: none;
        }
        #joystick-thumb {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: none;
            transition: transform 0.05s linear;
        }

        #attack-btn {
            position: absolute; bottom: 35px; right: 35px; width: 90px; height: 90px;
            background: rgba(220, 38, 38, 0.85); border: 3px solid #f87171; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4); cursor: pointer; pointer-events: auto;
        }
        #attack-btn:active { background: #ef4444; transform: scale(0.92); }

        /* Game Over / Start Modal */
        #overlay {
            position: absolute; inset: 0; background: rgba(5, 5, 8, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; text-align: center; padding: 20px;
        }
        #overlay h1 { font-size: 36px; color: #ef4444; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        #overlay p { font-size: 16px; color: #aaa; margin-bottom: 25px; max-width: 400px; }
        button.start-button {
            padding: 14px 36px; font-size: 18px; font-weight: bold; color: #fff;
            background: #dc2626; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5);
        }
    </style>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-group">
            <div class="floor-badge" id="floor-text">FLOOR 1</div>
            <div class="stat-row">
                <span>HP</span>
                <div class="bar-container"><div id="hp-bar"></div></div>
                <span id="hp-text" style="font-size: 12px;">100</span>
            </div>
        </div>
        <div class="hud-group" style="align-items: flex-end; font-size: 12px; color: #ccc;">
            <span>⚔️ ATK: <b id="atk-text">20</b></span>
            <span>⚡ SPD: <b id="spd-text">7.0</b></span>
            <span>💀 KILLS: <b id="kills-text">0</b></span>
        </div>
    </div>

    <div id="log"></div>

    <!-- Mobile Controls UI -->
    <div id="virtual-joystick"><div id="joystick-thumb"></div></div>
    <div id="attack-btn">⚔️</div>

    <div id="overlay">
        <h1 id="overlay-title" style="color: #fbbf24;">EMBER DEPTHS</h1>
        <p id="overlay-desc">Use the left thumb joystick to move through catacombs, and tap the right attack button to slash enemies. Find the purple portal to descend deeper.</p>
        <button class="start-button" id="start-btn">ENTER DUNGEON</button>
    </div>
</div>

<script>
/**
 * 2.5D MOBILE-OPTIMIZED ROGUELIKE DUNGEON CRAWLER
 */

const MAP_SIZE = 34;
const TILE_SIZE = 2;
const WALL_HEIGHT = 2.6;

let scene, camera, renderer, torchLight, slashMesh;
let isGameRunning = false;
let clock = new THREE.Clock();

let grid = [];
let mapGroup = new THREE.Group();
let entityGroup = new THREE.Group();

const player = {
    mesh: null,
    x: 0, z: 0,
    hp: 100, maxHp: 100,
    atk: 20, speed: 7.0,
    angle: 0,
    attackCooldown: 0,
    invulnTimer: 0,
    kills: 0,
    floor: 1
};

let enemies = [];
let items = [];
let particles = [];
let exitPortal = null;

// Touch & Joystick Input State
const joystickState = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0 };
const keys = {};

function initEngine() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070709);
    scene.fog = new THREE.FogExp2(0x070709, 0.045);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('game-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x2a2a3d, 0.6);
    scene.add(ambientLight);

    torchLight = new THREE.PointLight(0xff8c3b, 2.2, 16, 1.5);
    torchLight.castShadow = true;
    scene.add(torchLight);

    scene.add(mapGroup);
    scene.add(entityGroup);

    createPlayerMesh();
    setupTouchControls();
    window.addEventListener('resize', onWindowResize);
}

function createPlayerMesh() {
    const group = new THREE.Group();

    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.2, 10);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    body.castShadow = true;
    group.add(body);

    const headGeo = new THREE.SphereGeometry(0.32, 10, 10);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.6, roughness: 0.2 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.35;
    head.castShadow = true;
    group.add(head);

    const swordGeo = new THREE.BoxGeometry(0.12, 0.12, 1.1);
    const swordMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0x78350f });
    const sword = new THREE.Mesh(swordGeo, swordMat);
    sword.position.set(0.45, 0.75, 0.45);
    group.add(sword);

    const slashGeo = new THREE.RingGeometry(0.8, 2.1, 16, 1, -Math.PI / 3, (2 * Math.PI) / 3);
    const slashMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    slashMesh = new THREE.Mesh(slashGeo, slashMat);
    slashMesh.rotation.x = -Math.PI / 2;
    slashMesh.rotation.z = -Math.PI / 2;
    slashMesh.position.y = 0.75;
    group.add(slashMesh);

    player.mesh = group;
    scene.add(player.mesh);
}

// --- PROCEDURAL DUNGEON GENERATOR ---
function generateDungeon() {
    while(mapGroup.children.length > 0) mapGroup.remove(mapGroup.children[0]);
    while(entityGroup.children.length > 0) entityGroup.remove(entityGroup.children[0]);
    enemies = [];
    items = [];

    grid = Array.from({ length: MAP_SIZE }, () => Array(MAP_SIZE).fill(2));
    const rooms = [];
    const numRooms = 8 + Math.min(player.floor, 5);

    for (let i = 0; i < numRooms * 3; i++) {
        if (rooms.length >= numRooms) break;
        const w = Math.floor(Math.random() * 4) + 4;
        const h = Math.floor(Math.random() * 4) + 4;
        const x = Math.floor(Math.random() * (MAP_SIZE - w - 2)) + 1;
        const y = Math.floor(Math.random() * (MAP_SIZE - h - 2)) + 1;

        const newRoom = { x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) };

        let overlaps = false;
        for (const r of rooms) {
            if (newRoom.x - 1 < r.x + r.w && newRoom.x + newRoom.w + 1 > r.x &&
                newRoom.y - 1 < r.y + r.h && newRoom.y + newRoom.h + 1 > r.y) {
                overlaps = true;
                break;
            }
        }

        if (!overlaps) {
            carveRoom(newRoom);
            if (rooms.length > 0) {
                const prev = rooms[rooms.length - 1];
                carveCorridor(prev.cx, prev.cy, newRoom.cx, newRoom.cy);
            }
            rooms.push(newRoom);
        }
    }

    buildDungeonGeometry();

    const startRoom = rooms[0];
    player.x = startRoom.cx * TILE_SIZE;
    player.z = startRoom.cy * TILE_SIZE;
    player.mesh.position.set(player.x, 0, player.z);

    const endRoom = rooms[rooms.length - 1];
    spawnExitPortal(endRoom.cx * TILE_SIZE, endRoom.cy * TILE_SIZE);

    for (let i = 1; i < rooms.length; i++) {
        const r = rooms[i];
        const enemyCount = Math.floor(Math.random() * 2) + 1 + Math.floor(player.floor / 2);
        for (let e = 0; e < enemyCount; e++) {
            spawnEnemy((r.x + 1 + Math.random() * (r.w - 2)) * TILE_SIZE, (r.y + 1 + Math.random() * (r.h - 2)) * TILE_SIZE);
        }
        if (Math.random() < 0.5) spawnItem(r.cx * TILE_SIZE, r.cy * TILE_SIZE);
    }

    logEvent(`Entered Floor ${player.floor}`);
    updateHUD();
}

function carveRoom(r) {
    for (let y = r.y; y < r.y + r.h; y++) {
        for (let x = r.x; x < r.x + r.w; x++) grid[y][x] = 1;
    }
}

function carveCorridor(x1, y1, x2, y2) {
    let x = x1, y = y1;
    while (x !== x2) { grid[y][x] = 1; x += x < x2 ? 1 : -1; }
    while (y !== y2) { grid[y][x] = 1; y += y < y2 ? 1 : -1; }
}

function buildDungeonGeometry() {
    const floorGeo = new THREE.BoxGeometry(TILE_SIZE, 0.2, TILE_SIZE);
    const floorMat1 = new THREE.MeshStandardMaterial({ color: 0x1e2028, roughness: 0.85 });
    const floorMat2 = new THREE.MeshStandardMaterial({ color: 0x252833, roughness: 0.85 });
    const wallGeo = new THREE.BoxGeometry(TILE_SIZE, WALL_HEIGHT, TILE_SIZE);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3b3e4d, roughness: 0.7 });

    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            if (grid[y][x] === 1) {
                const tile = new THREE.Mesh(floorGeo, (x + y) % 2 === 0 ? floorMat1 : floorMat2);
                tile.position.set(x * TILE_SIZE, -0.1, y * TILE_SIZE);
                tile.receiveShadow = true;
                mapGroup.add(tile);
            } else if (hasAdjacentFloor(x, y)) {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(x * TILE_SIZE, WALL_HEIGHT / 2, y * TILE_SIZE);
                wall.castShadow = true;
                mapGroup.add(wall);
            }
        }
    }
}

function hasAdjacentFloor(x, y) {
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const ny = y + dy, nx = x + dx;
            if (ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE && grid[ny][nx] === 1) return true;
        }
    }
    return false;
}

function spawnEnemy(x, z) {
    const isBrute = Math.random() < (0.15 * player.floor);
    const scale = isBrute ? 1.3 : 0.95;
    const hp = (isBrute ? 70 : 35) + (player.floor - 1) * 10;
    const atk = (isBrute ? 16 : 10) + (player.floor - 1) * 2;

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.8 * scale, 1.3 * scale, 0.8 * scale),
        new THREE.MeshStandardMaterial({ color: isBrute ? 0x991b1b : 0x16a34a })
    );
    mesh.position.set(x, (1.3 * scale) / 2, z);
    mesh.castShadow = true;
    entityGroup.add(mesh);

    enemies.push({ mesh, x, z, hp, maxHp: hp, atk, speed: isBrute ? 3.0 : 4.2, radius: 0.4 * scale, hitFlash: 0, attackCooldown: 0 });
}

function spawnItem(x, z) {
    const types = ['heal', 'atk', 'spd'];
    const type = types[Math.floor(Math.random() * types.length)];
    const colors = { heal: 0xef4444, atk: 0xf59e0b, spd: 0x06b6d4 };

    const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.4),
        new THREE.MeshStandardMaterial({ color: colors[type], emissive: colors[type], emissiveIntensity: 0.5 })
    );
    mesh.position.set(x, 0.6, z);
    entityGroup.add(mesh);
    items.push({ mesh, x, z, type });
}

function spawnExitPortal(x, z) {
    const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(0.8, 0.15, 10, 20),
        new THREE.MeshBasicMaterial({ color: 0xa855f7 })
    );
    mesh.rotation.x = Math.PI / 2;
    mesh.position.set(x, 0.1, z);
    entityGroup.add(mesh);

    const light = new THREE.PointLight(0xa855f7, 1.8, 6);
    light.position.set(x, 1.2, z);
    entityGroup.add(light);
    exitPortal = { mesh, x, z };
}

// --- GAMEPLAY LOOP & COMBAT ---
function performAttack() {
    if (player.attackCooldown > 0 || !isGameRunning) return;
    player.attackCooldown = 0.35;
    slashMesh.material.opacity = 0.85;

    const attackRange = 2.6;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = e.x - player.x;
        const dz = e.z - player.z;
        const dist = Math.hypot(dx, dz);

        if (dist <= attackRange + e.radius) {
            e.hp -= player.atk;
            e.hitFlash = 0.15;
            moveEntityWithCollision(e, (dx / dist) * 0.5, (dz / dist) * 0.5);
            spawnParticles(e.x, 0.8, e.z, 0xef4444, 5);

            if (e.hp <= 0) {
                entityGroup.remove(e.mesh);
                enemies.splice(i, 1);
                player.kills++;
                updateHUD();
                if (Math.random() < 0.25) spawnItem(e.x, e.z);
            }
        }
    }
}

function moveEntityWithCollision(entity, dx, dz, radius = 0.4) {
    const nextX = entity.x + dx;
    if (!isWallAt(nextX + radius, entity.z + radius) && !isWallAt(nextX - radius, entity.z - radius)) entity.x = nextX;
    const nextZ = entity.z + dz;
    if (!isWallAt(entity.x + radius, nextZ + radius) && !isWallAt(entity.x - radius, nextZ - radius)) entity.z = nextZ;
}

function isWallAt(wx, wz) {
    const gx = Math.round(wx / TILE_SIZE);
    const gz = Math.round(wz / TILE_SIZE);
    return gx < 0 || gx >= MAP_SIZE || gz < 0 || gz >= MAP_SIZE || grid[gz][gx] !== 1;
}

function spawnParticles(x, y, z, color, count) {
    const geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
    const mat = new THREE.MeshBasicMaterial({ color });
    for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        entityGroup.add(mesh);
        particles.push({ mesh, vx: (Math.random() - 0.5) * 5, vy: Math.random() * 3 + 2, vz: (Math.random() - 0.5) * 5, life: 0.35 });
    }
}

function update(dt) {
    if (!isGameRunning) return;

    // Joystick movement processing
    if (joystickState.active && (joystickState.moveX !== 0 || joystickState.moveY !== 0)) {
        const moveX = joystickState.moveX * player.speed * dt;
        const moveZ = joystickState.moveY * player.speed * dt;
        moveEntityWithCollision(player, moveX, moveZ, 0.4);
        player.angle = Math.atan2(joystickState.moveX, joystickState.moveY);
        player.mesh.rotation.y = player.angle;
    }

    player.mesh.position.set(player.x, 0, player.z);

    if (player.attackCooldown > 0) player.attackCooldown -= dt;
    if (player.invulnTimer > 0) player.invulnTimer -= dt;
    if (slashMesh.material.opacity > 0) slashMesh.material.opacity = Math.max(0, slashMesh.material.opacity - dt * 4);

    torchLight.position.set(player.x, 2.8, player.z);
    
    // Smooth Camera Follow
    const camTarget = new THREE.Vector3(player.x, 13.5, player.z + 10);
    camera.position.lerp(camTarget, 0.12);
    camera.lookAt(player.x, 0.5, player.z);

    // Enemy AI logic
    for (const e of enemies) {
        if (e.hitFlash > 0) { e.hitFlash -= dt; e.mesh.material.emissive.setHex(0xffffff); }
        else e.mesh.material.emissive.setHex(0x000000);
        if (e.attackCooldown > 0) e.attackCooldown -= dt;

        const dx = player.x - e.x;
        const dz = player.z - e.z;
        const dist = Math.hypot(dx, dz);

        if (dist < 11 && dist > 0.8) {
            moveEntityWithCollision(e, (dx / dist) * e.speed * dt, (dz / dist) * e.speed * dt, e.radius);
            e.mesh.rotation.y = Math.atan2(dx, dz);
        }

        if (dist <= 1.15 && e.attackCooldown <= 0 && player.invulnTimer <= 0) {
            player.hp = Math.max(0, player.hp - e.atk);
            player.invulnTimer = 0.5;
            e.attackCooldown = 1.0;
            spawnParticles(player.x, 1.0, player.z, 0xef4444, 6);
            updateHUD();
            if (player.hp <= 0) { gameOver(); return; }
        }
        e.mesh.position.set(e.x, e.mesh.position.y, e.z);
    }

    // Item Collection
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.mesh.rotation.y += dt * 2;
        if (Math.hypot(player.x - item.x, player.z - item.z) < 1.0) {
            if (item.type === 'heal') { player.hp = Math.min(player.maxHp, player.hp + 30); logEvent("Potion (+30 HP)"); }
            else if (item.type === 'atk') { player.atk += 4; logEvent("Whetstone (+4 ATK)"); }
            else if (item.type === 'spd') { player.speed = Math.min(10, player.speed + 0.4); logEvent("Swift Boots"); }
            entityGroup.remove(item.mesh);
            items.splice(i, 1);
            updateHUD();
        }
    }

    // Portal Exit
    if (exitPortal) {
        exitPortal.mesh.rotation.z += dt * 2;
        if (Math.hypot(player.x - exitPortal.x, player.z - exitPortal.z) < 1.1) {
            player.floor++;
            player.hp = Math.min(player.maxHp, player.hp + 15);
            generateDungeon();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.mesh.position.addScaledVector(new THREE.Vector3(p.vx, p.vy, p.vz), dt);
        p.vy -= 10 * dt;
        if (p.life <= 0) { entityGroup.remove(p.mesh); particles.splice(i, 1); }
    }
}

function animate() {
    requestAnimationFrame(animate);
    update(Math.min(clock.getDelta(), 0.1));
    renderer.render(scene, camera);
}

// --- TOUCH CONTROLS HANDLER ---
function setupTouchControls() {
    const joystickArea = document.getElementById('virtual-joystick');
    const thumb = document.getElementById('joystick-thumb');

    joystickArea.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.targetTouches[0];
        joystickState.active = true;
        const rect = joystickArea.getBoundingClientRect();
        joystickState.startX = rect.left + rect.width / 2;
        joystickState.startY = rect.top + rect.height / 2;
    }, { passive: false });

    window.addEventListener('touchmove', e => {
        if (!joystickState.active) return;
        e.preventDefault();
        const touch = e.targetTouches[0];
        const dx = touch.clientX - joystickState.startX;
        const dy = touch.clientY - joystickState.startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 40;

        const angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);
        
        thumb.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
        
        joystickState.moveX = (Math.cos(angle) * clampedDist) / maxDist;
        joystickState.moveY = (Math.sin(angle) * clampedDist) / maxDist;
    }, { passive: false });

    const endJoystick = () => {
        if (!joystickState.active) return;
        joystickState.active = false;
        joystickState.moveX = 0;
        joystickState.moveY = 0;
        thumb.style.transform = `translate(0px, 0px)`;
    };

    window.addEventListener('touchend', endJoystick);
    window.addEventListener('touchcancel', endJoystick);

    document.getElementById('attack-btn').addEventListener('touchstart', e => {
        e.preventDefault();
        performAttack();
    }, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('virtual-joystick').style.display = 'block';
        player.hp = 100; player.maxHp = 100; player.atk = 20; player.speed = 7.0; player.kills = 0; player.floor = 1;
        generateDungeon();
        isGameRunning = true;
    });
}

function updateHUD() {
    document.getElementById('floor-text').innerText = `FLOOR ${player.floor}`;
    document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('hp-text').innerText = player.hp;
    document.getElementById('atk-text').innerText = player.atk;
    document.getElementById('spd-text').innerText = player.speed.toFixed(1);
    document.getElementById('kills-text').innerText = player.kills;
}

function logEvent(text) {
    const log = document.getElementById('log');
    const div = document.createElement('div');
    div.className = 'log-msg';
    div.innerText = text;
    log.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

function gameOver() {
    isGameRunning = false;
    document.getElementById('virtual-joystick').style.display = 'none';
    const overlay = document.getElementById('overlay');
    document.getElementById('overlay-title').innerText = "YOU PERISHED";
    document.getElementById('overlay-desc').innerText = `Fell on Floor ${player.floor} after slaying ${player.kills} monsters.`;
    document.getElementById('start-btn').innerText = "TRY AGAIN";
    overlay.style.display = 'flex';
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

initEngine();
animate();
</script>
</body>
